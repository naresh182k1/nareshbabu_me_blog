<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Two panel comparison. Pattern A, naive retry, sends the entire conversation history back on every failure, costing 12000, 26000, and 54000 tokens across three attempts for a total of 92000. Pattern B, delta repair, returns only the typed error and the failing fragment, with a circuit breaker escalating after two attempts, for a total of 25200 tokens.">
<style>
  text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .d-bx{fill:#ffffff;stroke:#c9d4e1;stroke-width:1.4}
  .d-a{fill:#e9eff7;stroke:#1e3a5f;stroke-width:1.8}
  .d-g{fill:#e6f6ed;stroke:#1a8d4c;stroke-width:1.8}
  .d-w{fill:#fdf1e2;stroke:#e8913a;stroke-width:1.8}
  .d-r{fill:#fbe6e2;stroke:#b83527;stroke-width:1.8}
  .d-x{fill:#f3f6fa;stroke:#aebbcb;stroke-width:1.4}
  .d-n{fill:#e6ebf2;stroke:#a9b7c8;stroke-width:1.4}
  .d-navy{fill:#1e3a5f;stroke:#1e3a5f}
  .dt{font-size:15px;font-weight:700;fill:#12233a}
  .dts{font-size:12.5px;font-weight:500;fill:#4b5c72}
  .dtw{font-size:15px;font-weight:700;fill:#9c5c14}
  .dtg{font-size:15px;font-weight:700;fill:#166b3c}
  .dtr{font-size:14px;font-weight:700;fill:#a52f22}
  .dl{font-size:12px;fill:#3b4b5f;font-weight:600}
  .dlg{font-size:12.5px;fill:#4b5c72;font-weight:500}
  .dlane{font-size:12.5px;font-weight:700;letter-spacing:.06em}
  .dpanel{font-size:14px;font-weight:700;letter-spacing:.03em}
  .dbar{font-size:14px;font-weight:700;fill:#12233a}
  .dln{stroke:#94a4b7;stroke-width:1.6;fill:none}
  .dln-r{stroke:#cf7a6d;stroke-width:1.8;fill:none}
  .dln-g{stroke:#5cb98c;stroke-width:1.8;fill:none}
  .dln-d{stroke:#b6c2d1;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
</style>
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="c2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a4b7"/>
    </marker>
    <marker id="c2r" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#cf7a6d"/>
    </marker>
    <marker id="c2g" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5cb98c"/>
    </marker>
  </defs>

  <text class="dpanel" x="25" y="30" fill="#b83527">PATTERN A · Naive retry, the whole conversation goes back every time</text>

  <line class="dln" x1="220" y1="93" x2="234" y2="93" marker-end="url(#c2)"/>
  <line class="dln" x1="435" y1="93" x2="449" y2="93" marker-end="url(#c2)"/>
  <line class="dln" x1="650" y1="93" x2="664" y2="93" marker-end="url(#c2)"/>

  <rect class="d-x" x="25" y="56" width="195" height="74" rx="10"/>
  <text class="dt" x="122" y="88" text-anchor="middle">Prompt assembly</text>
  <text class="dts" x="122" y="110" text-anchor="middle">system, tools, task</text>

  <rect class="d-a" x="240" y="56" width="195" height="74" rx="10"/>
  <text class="dt" x="337" y="88" text-anchor="middle">Model call</text>
  <text class="dts" x="337" y="110" text-anchor="middle">plans the tool call</text>

  <rect class="d-a" x="455" y="56" width="195" height="74" rx="10"/>
  <text class="dt" x="552" y="88" text-anchor="middle">Tool execution</text>
  <text class="dts" x="552" y="110" text-anchor="middle">schema checked</text>

  <rect class="d-r" x="670" y="56" width="195" height="74" rx="10"/>
  <text class="dt" x="767" y="88" text-anchor="middle">Validator</text>
  <text class="dtr" x="767" y="110" text-anchor="middle">rejects</text>

  <path class="dln-r" d="M767,130 V172 H337 V136" marker-end="url(#c2r)"/>
  <text class="dl" x="552" y="164" text-anchor="middle">the entire history goes back, prompt, tools, task, and every prior attempt</text>

  <rect class="d-bx" x="25" y="196" width="170" height="34" rx="7"/>
  <text class="dts" x="41" y="218">attempt 1 · 12k</text>
  <rect class="d-w" x="205" y="196" width="170" height="34" rx="7"/>
  <text class="dts" x="221" y="218">attempt 2 · 26k</text>
  <rect class="d-r" x="385" y="196" width="170" height="34" rx="7"/>
  <text class="dts" x="401" y="218">attempt 3 · 54k</text>
  <rect class="d-r" x="565" y="196" width="330" height="34" rx="7"/>
  <text class="dtr" x="581" y="219">92k tokens, one outcome, still unverified</text>

  <line class="dln-d" x1="25" y1="258" x2="975" y2="258"/>

  <text class="dpanel" x="25" y="292" fill="#166b3c">PATTERN B · Delta repair, only the typed error and the failing fragment go back</text>

  <line class="dln" x1="220" y1="355" x2="234" y2="355" marker-end="url(#c2)"/>
  <line class="dln" x1="435" y1="355" x2="449" y2="355" marker-end="url(#c2)"/>
  <line class="dln" x1="650" y1="355" x2="664" y2="355" marker-end="url(#c2)"/>

  <rect class="d-x" x="25" y="318" width="195" height="74" rx="10"/>
  <text class="dt" x="122" y="350" text-anchor="middle">Prompt assembly</text>
  <text class="dts" x="122" y="372" text-anchor="middle">cached stable prefix</text>

  <rect class="d-a" x="240" y="318" width="195" height="74" rx="10"/>
  <text class="dt" x="337" y="350" text-anchor="middle">Model call</text>
  <text class="dts" x="337" y="372" text-anchor="middle">repairs the fragment</text>

  <rect class="d-a" x="455" y="318" width="195" height="74" rx="10"/>
  <text class="dt" x="552" y="350" text-anchor="middle">Tool execution</text>
  <text class="dts" x="552" y="372" text-anchor="middle">constrained output</text>

  <rect class="d-g" x="670" y="318" width="195" height="74" rx="10"/>
  <text class="dt" x="767" y="350" text-anchor="middle">Validator</text>
  <text class="dts" x="767" y="372" text-anchor="middle">emits a typed error</text>

  <rect class="d-g" x="430" y="430" width="250" height="54" rx="10"/>
  <text class="dt" x="555" y="452" text-anchor="middle">Repair and circuit breaker</text>
  <text class="dts" x="555" y="472" text-anchor="middle">two attempts, then escalate</text>

  <path class="dln-g" d="M767,392 V457 H686" marker-end="url(#c2g)"/>
  <path class="dln-g" d="M430,457 H337 V398" marker-end="url(#c2g)"/>
  <text class="dl" x="726" y="448" text-anchor="middle">typed error</text>
  <text class="dl" x="383" y="448" text-anchor="middle">delta only</text>

  <rect class="d-bx" x="25" y="502" width="170" height="34" rx="7"/>
  <text class="dts" x="41" y="524">attempt 1 · 12k</text>
  <rect class="d-g" x="205" y="502" width="170" height="34" rx="7"/>
  <text class="dts" x="221" y="524">attempt 2 · 13.2k</text>
  <rect class="d-g" x="385" y="502" width="210" height="34" rx="7"/>
  <text class="dts" x="401" y="524">breaker, then escalation</text>
  <rect class="d-g" x="605" y="502" width="290" height="34" rx="7"/>
  <text class="dtg" x="621" y="525">25.2k tokens, 3.6 times less, bounded</text>
</svg>
