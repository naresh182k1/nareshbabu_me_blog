    <text x="600" y="538" text-anchor="middle" font-size="18" fill="#94a3b8">The cheapest token is the one you do not send twice.</text>
    <text x="600" y="586" text-anchor="middle" font-size="15" fill="#64748b">nareshbabu.me</text>
