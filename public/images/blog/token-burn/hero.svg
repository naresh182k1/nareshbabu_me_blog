<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-tb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1d2a"/>
      <stop offset="100%" style="stop-color:#1f3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-tb)"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="600" y="112" text-anchor="middle" font-size="15" letter-spacing="6" font-weight="700" fill="#e8913a">COST ENGINEERING</text>
    <text x="600" y="196" text-anchor="middle" font-size="52" font-weight="700" fill="#f1f5f9">What Did Your Agents</text>
    <text x="600" y="262" text-anchor="middle" font-size="52" font-weight="700" fill="#93c5fd">Burn Last Month?</text>
    <line x1="480" y1="312" x2="720" y2="312" stroke="#e8913a" stroke-width="3"/>
    <g transform="translate(140,360)">
      <rect width="280" height="112" rx="14" fill="#0f2335" stroke="#3b5a80" stroke-width="2"/>
      <text x="140" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">Attribute</text>
      <text x="140" y="76" text-anchor="middle" font-size="15" fill="#94a3b8">cost per outcome</text>
    </g>
    <g transform="translate(460,360)">
      <rect width="280" height="112" rx="14" fill="#0f2335" stroke="#e8913a" stroke-width="2"/>
      <text x="140" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#f0a85c">Retry loops</text>
