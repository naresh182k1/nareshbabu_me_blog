<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-label="Architecture diagram: a request flows through a policy gate, agent runtime, and tool broker into a system of record. Agent identity, guardrails, and human oversight sit beneath as control points. All of it writes to an immutable run log, which renders an evidence pack mapped to ISO 42001, the EU AI Act, and AIUC-1.">
<style>
  text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .d-bx{fill:#ffffff;stroke:#c9d4e1;stroke-width:1.4}
  .d-a{fill:#e9eff7;stroke:#1e3a5f;stroke-width:1.8}
  .d-g{fill:#e6f6ed;stroke:#1a8d4c;stroke-width:1.8}
  .d-w{fill:#fdf1e2;stroke:#e8913a;stroke-width:1.8}
  .d-r{fill:#fbe6e2;stroke:#b83527;stroke-width:1.8}
  .d-x{fill:#f3f6fa;stroke:#aebbcb;stroke-width:1.4}
  .d-n{fill:#e6ebf2;stroke:#a9b7c8;stroke-width:1.4}
  .d-navy{fill:#1e3a5f;stroke:#1e3a5f}
  .dt{font-size:15px;font-weight:700;fill:#12233a}
  .dts{font-size:12.5px;font-weight:500;fill:#4b5c72}
  .dtw{font-size:15px;font-weight:700;fill:#9c5c14}
  .dtg{font-size:15px;font-weight:700;fill:#166b3c}
  .dtr{font-size:14px;font-weight:700;fill:#a52f22}
  .dl{font-size:12px;fill:#3b4b5f;font-weight:600}
  .dlg{font-size:12.5px;fill:#4b5c72;font-weight:500}
  .dlane{font-size:12.5px;font-weight:700;letter-spacing:.06em}
  .dpanel{font-size:14px;font-weight:700;letter-spacing:.03em}
  .dbar{font-size:14px;font-weight:700;fill:#12233a}
  .dln{stroke:#94a4b7;stroke-width:1.6;fill:none}
  .dln-r{stroke:#cf7a6d;stroke-width:1.8;fill:none}
  .dln-g{stroke:#5cb98c;stroke-width:1.8;fill:none}
  .dln-d{stroke:#b6c2d1;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
</style>
<rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a4b7"/>
    </marker>
  </defs>

  <line class="dln" x1="203" y1="119" x2="212" y2="119" marker-end="url(#a1)"/>
  <line class="dln" x1="396" y1="119" x2="405" y2="119" marker-end="url(#a1)"/>
  <line class="dln" x1="589" y1="119" x2="598" y2="119" marker-end="url(#a1)"/>
  <line class="dln" x1="782" y1="119" x2="791" y2="119" marker-end="url(#a1)"/>
  <text class="dl" x="207" y="66" text-anchor="middle">signed request</text>
  <text class="dl" x="400" y="66" text-anchor="middle">allow or escalate</text>
  <text class="dl" x="593" y="66" text-anchor="middle">tool call and intent</text>
  <text class="dl" x="786" y="66" text-anchor="middle">scoped write</text>

  <rect class="d-x" x="25" y="80" width="178" height="78" rx="10"/>
  <text class="dt" x="114" y="114" text-anchor="middle">Trigger</text>
  <text class="dts" x="114" y="137" text-anchor="middle">user, queue or event</text>

  <rect class="d-a" x="218" y="80" width="178" height="78" rx="10"/>
  <text class="dt" x="307" y="114" text-anchor="middle">Policy Gate</text>
  <text class="dts" x="307" y="137" text-anchor="middle">purpose and risk tier</text>

  <rect class="d-x" x="411" y="80" width="178" height="78" rx="10"/>
  <text class="dt" x="500" y="114" text-anchor="middle">Agent Runtime</text>
  <text class="dts" x="500" y="137" text-anchor="middle">model and planner</text>

  <rect class="d-a" x="604" y="80" width="178" height="78" rx="10"/>
  <text class="dt" x="693" y="114" text-anchor="middle">Tool Broker</text>
  <text class="dts" x="693" y="137" text-anchor="middle">scopes and quotas</text>

  <rect class="d-x" x="797" y="80" width="178" height="78" rx="10"/>
  <text class="dt" x="886" y="114" text-anchor="middle">System of Record</text>
  <text class="dts" x="886" y="137" text-anchor="middle">core banking, CRM</text>

  <line class="dln" x1="307" y1="158" x2="307" y2="216" marker-end="url(#a1)"/>
  <line class="dln" x1="500" y1="158" x2="500" y2="216" marker-end="url(#a1)"/>
  <line class="dln" x1="693" y1="158" x2="693" y2="216" marker-end="url(#a1)"/>
  <text class="dl" x="307" y="193" text-anchor="middle">resolves identity</text>
  <text class="dl" x="500" y="193" text-anchor="middle">screens in and out</text>
  <text class="dl" x="693" y="193" text-anchor="middle">routes escalation</text>

  <rect class="d-a" x="218" y="222" width="178" height="78" rx="10"/>
  <text class="dt" x="307" y="256" text-anchor="middle">Agent Identity</text>
  <text class="dts" x="307" y="279" text-anchor="middle">own credential, scoped</text>

  <rect class="d-g" x="411" y="222" width="178" height="78" rx="10"/>
  <text class="dt" x="500" y="256" text-anchor="middle">I/O Guardrails</text>
  <text class="dts" x="500" y="279" text-anchor="middle">injection, PII, refusal</text>

  <rect class="d-a" x="604" y="222" width="178" height="78" rx="10"/>
  <text class="dt" x="693" y="256" text-anchor="middle">Human Oversight</text>
  <text class="dts" x="693" y="279" text-anchor="middle">approve, amend, reject</text>

  <line class="dln-d" x1="114" y1="158" x2="114" y2="350"/>
  <line class="dln-d" x1="886" y1="158" x2="886" y2="350"/>
  <line class="dln" x1="307" y1="300" x2="307" y2="350" marker-end="url(#a1)"/>
  <line class="dln" x1="500" y1="300" x2="500" y2="350" marker-end="url(#a1)"/>
  <line class="dln" x1="693" y1="300" x2="693" y2="350" marker-end="url(#a1)"/>

  <rect class="d-w" x="25" y="356" width="950" height="80" rx="10"/>
  <text class="dtw" x="500" y="391" text-anchor="middle">Immutable Run Log, append only and tamper evident</text>
  <text class="dts" x="500" y="415" text-anchor="middle">prompt · retrieved context · every tool call · model and version · approvals · latency · tokens · cost</text>

  <line class="dln" x1="500" y1="436" x2="500" y2="484" marker-end="url(#a1)"/>
  <text class="dl" x="512" y="464">queried per release and per quarter</text>

  <rect class="d-w" x="25" y="490" width="950" height="94" rx="10"/>
  <text class="dtw" x="500" y="524" text-anchor="middle">Evidence Pack, rendered on demand rather than written by hand</text>
  <text class="dts" x="205" y="556" text-anchor="middle">ISO/IEC 42001 Annex A</text>
  <text class="dts" x="500" y="556" text-anchor="middle">EU AI Act Art. 9 to 15 and Annex IV</text>
  <text class="dts" x="800" y="556" text-anchor="middle">AIUC-1 six domains</text>

  <g transform="translate(25,614)">
    <rect class="d-a" x="0" y="0" width="15" height="15" rx="3"/>
    <text class="dlg" x="23" y="12">Control you build</text>
    <rect class="d-g" x="190" y="0" width="15" height="15" rx="3"/>
    <text class="dlg" x="213" y="12">Automated gate</text>
    <rect class="d-w" x="370" y="0" width="15" height="15" rx="3"/>
    <text class="dlg" x="393" y="12">Evidence artefact</text>
    <rect class="d-x" x="560" y="0" width="15" height="15" rx="3"/>
    <text class="dlg" x="583" y="12">Existing platform, unchanged</text>
  </g>
</svg>
