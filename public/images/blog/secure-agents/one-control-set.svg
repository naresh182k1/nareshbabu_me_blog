<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Convergence diagram: ISO IEC 42001, the EU AI Act, and AIUC-1 all map into a single set of eight controls, which renders three different evidence outputs: a Statement of Applicability, an Annex IV technical file, and an audit evidence bundle.">
<style>
  text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .d-bx{fill:#ffffff;stroke:#c9d4e1;stroke-width:1.4}
  .d-a{fill:#e9eff7;stroke:#1e3a5f;stroke-width:1.8}
  .d-g{fill:#e6f6ed;stroke:#1a8d4c;stroke-width:1.8}
  .d-w{fill:#fdf1e2;stroke:#e8913a;stroke-width:1.8}
  .d-r{fill:#fbe6e2;stroke:#b83527;stroke-width:1.8}
  .d-x{fill:#f3f6fa;stroke:#aebbcb;stroke-width:1.4}
  .d-n{fill:#e6ebf2;stroke:#a9b7c8;stroke-width:1.4}
  .d-navy{fill:#1e3a5f;stroke:#1e3a5f}
  .dt{font-size:15px;font-weight:700;fill:#12233a}
  .dts{font-size:12.5px;font-weight:500;fill:#4b5c72}
  .dtw{font-size:15px;font-weight:700;fill:#9c5c14}
  .dtg{font-size:15px;font-weight:700;fill:#166b3c}
  .dtr{font-size:14px;font-weight:700;fill:#a52f22}
  .dl{font-size:12px;fill:#3b4b5f;font-weight:600}
  .dlg{font-size:12.5px;fill:#4b5c72;font-weight:500}
  .dlane{font-size:12.5px;font-weight:700;letter-spacing:.06em}
  .dpanel{font-size:14px;font-weight:700;letter-spacing:.03em}
  .dbar{font-size:14px;font-weight:700;fill:#12233a}
  .dln{stroke:#94a4b7;stroke-width:1.6;fill:none}
  .dln-r{stroke:#cf7a6d;stroke-width:1.8;fill:none}
  .dln-g{stroke:#5cb98c;stroke-width:1.8;fill:none}
  .dln-d{stroke:#b6c2d1;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
</style>
<rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a4b7"/>
    </marker>
  </defs>

  <rect class="d-bx" x="25" y="60" width="230" height="86" rx="10"/>
  <text class="dt" x="45" y="92">ISO/IEC 42001</text>
  <text class="dts" x="45" y="115">management system</text>
  <text class="dts" x="45" y="134">Annex A controls, certifiable</text>

  <rect class="d-bx" x="25" y="176" width="230" height="86" rx="10"/>
  <text class="dt" x="45" y="208">EU AI Act</text>
  <text class="dts" x="45" y="231">legal obligation</text>
  <text class="dts" x="45" y="250">Articles 9 to 15, high risk</text>

  <rect class="d-bx" x="25" y="292" width="230" height="86" rx="10"/>
  <text class="dt" x="45" y="324">AIUC-1</text>
  <text class="dts" x="45" y="347">independent audit</text>
  <text class="dts" x="45" y="366">six domains, insurable</text>

  <path class="dln" d="M255,103 H285 V210" marker-end="url(#a2)"/>
  <line class="dln" x1="255" y1="219" x2="303" y2="219" marker-end="url(#a2)"/>
  <path class="dln" d="M255,335 H285 V228" marker-end="url(#a2)"/>

  <rect class="d-a" x="310" y="56" width="330" height="326" rx="12"/>
  <text class="dt" x="475" y="90" text-anchor="middle">ONE CONTROL SET</text>
  <line class="dln" x1="336" y1="106" x2="614" y2="106"/>
  <text class="dts" x="336" y="138">1 · Lifecycle risk and impact assessment</text>
  <text class="dts" x="336" y="170">2 · Data governance and provenance</text>
  <text class="dts" x="336" y="202">3 · Technical documentation</text>
  <text class="dtw" x="336" y="234">4 · Logging and traceability</text>
  <text class="dts" x="336" y="266">5 · Human oversight</text>
  <text class="dts" x="336" y="298">6 · Accuracy, robustness, security</text>
  <text class="dts" x="336" y="330">7 · Transparency and disclosure</text>
  <text class="dts" x="336" y="362">8 · Third party and supply chain</text>

  <path class="dln" d="M640,210 H670 V103" marker-end="url(#a2)"/>
  <line class="dln" x1="640" y1="219" x2="688" y2="219" marker-end="url(#a2)"/>
  <path class="dln" d="M640,228 H670 V335" marker-end="url(#a2)"/>

  <rect class="d-w" x="695" y="60" width="280" height="86" rx="10"/>
  <text class="dtw" x="715" y="92">Statement of Applicability</text>
  <text class="dts" x="715" y="115">control by control evidence</text>
  <text class="dts" x="715" y="134">for the certification body</text>

  <rect class="d-w" x="695" y="176" width="280" height="86" rx="10"/>
  <text class="dtw" x="715" y="208">Annex IV technical file</text>
  <text class="dts" x="715" y="231">system description and testing</text>
  <text class="dts" x="715" y="250">for conformity assessment</text>

  <rect class="d-w" x="695" y="292" width="280" height="86" rx="10"/>
  <text class="dtw" x="715" y="324">Audit evidence bundle</text>
  <text class="dts" x="715" y="347">domain by domain</text>
  <text class="dts" x="715" y="366">for the auditor</text>

  <text class="dlg" x="25" y="420">Control 4 carries the weight. Seven of the other controls cannot be evidenced without a trustworthy log underneath them.</text>
  <text class="dlg" x="25" y="444">Three inputs. One implementation. Three outputs, all rendered from the same log, none written by hand.</text>
</svg>
