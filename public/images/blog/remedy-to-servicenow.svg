<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-r2s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1d2a"/>
      <stop offset="100%" style="stop-color:#1f3a5f"/>
    </linearGradient>
    <linearGradient id="arrow-r2s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <filter id="glow-r2s">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-r2s)"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#e2e8f0">
    <text x="600" y="90" text-anchor="middle" font-size="36" font-weight="700" fill="#93c5fd">Agentic Modernization</text>
    <text x="600" y="135" text-anchor="middle" font-size="22" fill="#cbd5e1">Remedy → ServiceNow</text>

    <g transform="translate(120,220)">
      <rect width="280" height="220" rx="18" fill="#0f2335" stroke="#475569" stroke-width="2"/>
      <text x="140" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#fca5a5">BMC Remedy</text>
      <text x="140" y="90" text-anchor="middle" font-size="16" fill="#cbd5e1">ITSM • AR System</text>
      <text x="140" y="120" text-anchor="middle" font-size="14" fill="#94a3b8">Workflows • Forms</text>
      <text x="140" y="145" text-anchor="middle" font-size="14" fill="#94a3b8">Filters • Escalations</text>
      <text x="140" y="170" text-anchor="middle" font-size="14" fill="#94a3b8">CMDB • Integrations</text>
      <text x="140" y="200" text-anchor="middle" font-size="13" fill="#64748b">Legacy</text>
    </g>

    <g transform="translate(460,250)" filter="url(#glow-r2s)">
      <rect width="280" height="160" rx="18" fill="#0a1a2a" stroke="#34d399" stroke-width="2"/>
      <text x="140" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#34d399">Agent Swarm</text>
      <text x="140" y="72" text-anchor="middle" font-size="14" fill="#cbd5e1">Discover • Reverse-Engineer</text>
      <text x="140" y="95" text-anchor="middle" font-size="14" fill="#cbd5e1">Map • Translate • Generate</text>
      <text x="140" y="118" text-anchor="middle" font-size="14" fill="#cbd5e1">Migrate • Validate</text>
      <text x="140" y="142" text-anchor="middle" font-size="13" fill="#94a3b8">LLM + MCP + RAG</text>
    </g>

    <g transform="translate(800,220)">
      <rect width="280" height="220" rx="18" fill="#0f2335" stroke="#475569" stroke-width="2"/>
      <text x="140" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#86efac">ServiceNow</text>
      <text x="140" y="90" text-anchor="middle" font-size="16" fill="#cbd5e1">Now Platform</text>
      <text x="140" y="120" text-anchor="middle" font-size="14" fill="#94a3b8">Flow Designer</text>
      <text x="140" y="145" text-anchor="middle" font-size="14" fill="#94a3b8">Catalog • Tables</text>
      <text x="140" y="170" text-anchor="middle" font-size="14" fill="#94a3b8">CMDB • Virtual Agent</text>
      <text x="140" y="200" text-anchor="middle" font-size="13" fill="#64748b">Modern</text>
    </g>

    <path d="M 400 330 L 460 330" stroke="url(#arrow-r2s)" stroke-width="6" fill="none"/>
    <path d="M 740 330 L 800 330" stroke="url(#arrow-r2s)" stroke-width="6" fill="none"/>
    <polygon points="455,322 470,330 455,338" fill="#34d399"/>
    <polygon points="795,322 810,330 795,338" fill="#34d399"/>

    <text x="600" y="540" text-anchor="middle" font-size="16" fill="#94a3b8">Reverse engineer the old. Generate the new. Validate every step.</text>
    <text x="600" y="585" text-anchor="middle" font-size="14" fill="#64748b">nareshbabu.me</text>
  </g>
</svg>
